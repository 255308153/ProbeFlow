services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: probeflow_test_agent
      POSTGRES_USER: probeflow
      POSTGRES_PASSWORD: probeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probeflow -d probeflow_test_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
