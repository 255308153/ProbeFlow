spring:
  application:
    name: probeflow-test-agent-backend
  datasource:
    url: ${PROBEFLOW_DB_URL:jdbc:postgresql://localhost:5432/probeflow_test_agent}
    username: ${PROBEFLOW_DB_USERNAME:probeflow}
    password: ${PROBEFLOW_DB_PASSWORD:probeflow}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${PROBEFLOW_REDIS_HOST:localhost}
      port: ${PROBEFLOW_REDIS_PORT:6379}

server:
  port: ${PROBEFLOW_SERVER_PORT:8080}
