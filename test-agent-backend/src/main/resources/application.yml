spring:
  application:
    name: probeflow-test-agent-backend
  datasource:
    url: ${PROBEFLOW_DB_URL:jdbc:postgresql://localhost:5432/probeflow_test_agent}
    username: ${PROBEFLOW_DB_USERNAME:probeflow}
    password: ${PROBEFLOW_DB_PASSWORD:probeflow}
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/postgresql
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${PROBEFLOW_REDIS_HOST:localhost}
      port: ${PROBEFLOW_REDIS_PORT:6379}

server:
  port: ${PROBEFLOW_SERVER_PORT:8080}

probeflow:
  embedding:
    dimension: ${PROBEFLOW_EMBEDDING_DIMENSION:1024}
    manual-real:
      enabled: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_ENABLED:false}
      profile-id: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_PROFILE_ID:manual-real-embedding}
      endpoint: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_ENDPOINT:}
      key: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_KEY:}
      model: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_MODEL:}
      dimension: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_DIMENSION:0}
      timeout-ms: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_TIMEOUT_MS:0}
      max-input-tokens: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_MAX_INPUT_TOKENS:0}
      query-prefix: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_QUERY_PREFIX:}
      document-prefix: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_DOCUMENT_PREFIX:}
      batch-size: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_BATCH_SIZE:0}
      failure-policy: ${PROBEFLOW_EMBEDDING_MANUAL_REAL_FAILURE_POLICY:}
  llm:
    allow-real-providers: ${PROBEFLOW_LLM_ALLOW_REAL_PROVIDERS:false}
    allowed-providers: ${PROBEFLOW_LLM_ALLOWED_PROVIDERS:fake}
    manual-real:
      enabled: ${PROBEFLOW_LLM_MANUAL_REAL_ENABLED:false}
      provider-name: ${PROBEFLOW_LLM_MANUAL_REAL_PROVIDER:manual-real}
      endpoint: ${PROBEFLOW_LLM_MANUAL_REAL_ENDPOINT:}
      key: ${PROBEFLOW_LLM_MANUAL_REAL_KEY:}
      model: ${PROBEFLOW_LLM_MANUAL_REAL_MODEL:}
      timeout-ms: ${PROBEFLOW_LLM_MANUAL_REAL_TIMEOUT_MS:0}
      max-tokens: ${PROBEFLOW_LLM_MANUAL_REAL_MAX_TOKENS:0}
      cost-limit-cents: ${PROBEFLOW_LLM_MANUAL_REAL_COST_LIMIT_CENTS:0}
  memory:
    fact-extractor:
      mode: ${PROBEFLOW_MEMORY_FACT_EXTRACTOR_MODE:deterministic}
      provider: ${PROBEFLOW_MEMORY_FACT_EXTRACTOR_PROVIDER:fake}
      model: ${PROBEFLOW_MEMORY_FACT_EXTRACTOR_MODEL:fake-model}
      template-id: ${PROBEFLOW_MEMORY_FACT_EXTRACTOR_TEMPLATE_ID:v5.memory-fact-extraction.v1}
  rerank:
    cross-encoder:
      enabled: ${PROBEFLOW_RERANK_CROSS_ENCODER_ENABLED:false}
      provider: ${PROBEFLOW_RERANK_CROSS_ENCODER_PROVIDER:disabled}
    llm:
      enabled: ${PROBEFLOW_RERANK_LLM_ENABLED:false}
      provider: ${PROBEFLOW_RERANK_LLM_PROVIDER:disabled}
      model: ${PROBEFLOW_RERANK_LLM_MODEL:deepseek-v4-pro}
  project-import:
    local-directory:
      allowed-roots: ${PROBEFLOW_PROJECT_IMPORT_LOCAL_DIRECTORY_ALLOWED_ROOTS:}
