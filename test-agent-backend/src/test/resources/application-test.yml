spring:
  datasource:
    url: jdbc:h2:mem:probeflow_test_agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/test
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379

probeflow:
  embedding:
    dimension: 1024
    manual-real:
      enabled: false
  llm:
    allow-real-providers: false
    allowed-providers: fake
    manual-real:
      enabled: false
  memory:
    fact-extractor:
      mode: deterministic
      provider: fake
      model: fake-model
      template-id: v5.memory-fact-extraction.v1
  rerank:
    cross-encoder:
      enabled: false
      provider: disabled
